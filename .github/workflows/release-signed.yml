name: NusaFit Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nusafit-signed-release
  cancel-in-progress: true

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 3. Gradle 8.13
      # --------------------------------------------------
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      # --------------------------------------------------
      # 4. Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          grep -q 'compileSdk = 36' app/build.gradle.kts

          ! grep -qi 'firebase' app/build.gradle.kts

          echo "Android project verified."
          echo "compileSdk = 36"
          echo "Firebase dependency is not required."

      # --------------------------------------------------
      # 5. Create temporary signing keystore
      # --------------------------------------------------
      - name: Create release keystore
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/nusafit-release.keystore" \
            -alias nusafit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "NusaFitTempStore123!" \
            -keypass "NusaFitTempStore123!" \
            -dname "CN=NusaFit, OU=Mobile, O=NusaFit, L=Indonesia, ST=West Java, C=ID"

          echo "Keystore created."

      # --------------------------------------------------
      # 6. Build signed Release APK
      # --------------------------------------------------
      - name: Build signed Release APK
        shell: bash
        env:
          NUSAFIT_KEYSTORE: ${{ runner.temp }}/nusafit-release.keystore
          NUSAFIT_STORE_PASSWORD: NusaFitTempStore123!
          NUSAFIT_KEY_ALIAS: nusafit
          NUSAFIT_KEY_PASSWORD: NusaFitTempStore123!
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PNUSAFIT_KEYSTORE="$NUSAFIT_KEYSTORE" \
            -PNUSAFIT_STORE_PASSWORD="$NUSAFIT_STORE_PASSWORD" \
            -PNUSAFIT_KEY_ALIAS="$NUSAFIT_KEY_ALIAS" \
            -PNUSAFIT_KEY_PASSWORD="$NUSAFIT_KEY_PASSWORD" \
            assembleRelease

      # --------------------------------------------------
      # 7. Verify APK exists
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          ls -lh "$APK"

      # --------------------------------------------------
      # 8. Verify APK signature
      # --------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name "apksigner" \
            -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$SDKMANAGER" verify --verbose "$APK"

      # --------------------------------------------------
      # 9. Rename APK
      # --------------------------------------------------
      - name: Prepare installable APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          mkdir -p release

          cp "$APK" "release/NusaFit-v1.0.0-release-signed.apk"

          ls -lh release/NusaFit-v1.0.0-release-signed.apk

      # --------------------------------------------------
      # 10. Upload installable APK
      # --------------------------------------------------
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Signed-Release-APK
          path: release/NusaFit-v1.0.0-release-signed.apk
          if-no-files-found: error
          retention-days: 30
